services:
  app:
    build: .
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      PUBLIC_ORIGIN: https://${SITE_DOMAIN:?Set SITE_DOMAIN in .env}
      OPERATOR_NAME: ${OPERATOR_NAME:?Set OPERATOR_NAME in .env}
      CONTACT_EMAIL: ${CONTACT_EMAIL:?Set CONTACT_EMAIL in .env}
      COPYRIGHT_EMAIL: ${COPYRIGHT_EMAIL:?Set COPYRIGHT_EMAIL in .env}
      HOSTING_DESCRIPTION: ${HOSTING_DESCRIPTION:?Set HOSTING_DESCRIPTION in .env}
      TRUST_PROXY: "1"
      BLOCKED_SHORTCODES: ${BLOCKED_SHORTCODES:-}
    volumes:
      - media-cache:/app/.cache
    mem_limit: 1g
    cpus: 2
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?Set SITE_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_healthy
volumes:
  media-cache:
  caddy-data:
  caddy-config:
